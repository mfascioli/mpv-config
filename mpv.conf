#########################################
# Misc settings, not related to quality #
#########################################

# Display time elapsed and playtime in the top left corner
#osd-level=3

save-position-on-quit
#display-fps=60
screenshot-format=png

ad-lavc-downmix=no
audio-channels=stereo
af=dynaudnorm
audio-file-auto=fuzzy                   # external audio doesn't have to match the file name exactly to autoload
audio-pitch-correction=yes              # automatically insert scaletempo when playing at higher speed

# Default sub/audio languages: English first, then Spanish.
# SDH tracks share the "en"/"eng" tag with regular English, so when both
# exist the container order decides which one is selected.
slang=en,eng,enUS,en-US,enGB,en-GB,es,spa,esES,es-ES,esMX,es-MX,unknown
alang=en,eng,enUS,en-US,enGB,en-GB,es,spa,esES,es-ES,esMX,es-MX
ytdl-raw-options=sub-lang="en,eng,enUS,en-US,enGB,en-GB,es,spa,esES,es-ES,esMX,es-MX",write-sub=

# Backward compatibility for vsfilter fansubs
sub-ass-use-video-data=all

no-border
osd-font='Alte Haas Grotesk Regular'
osd-font-size=14
osd-bold=no
osd-color='#CCFFFFFF'                   # ARGB format
osd-border-color='#DD322640'            # ARGB format
#osd-shadow-offset=1                    # pixel width for osd text and progress bar
osd-bar-align-y=0                       # progress bar y alignment (-1 top, 0 centered, 1 bottom)
osd-bar-h=2                             # height of osd bar as a fractional percentage of your screen height
osd-bar-w=60                            # width of " " "
osd-border-size=2                       # size for osd text and progress bar
hls-bitrate=max                         # use max quality for HLS streams

###################################
# Subtitles                       #
###################################

sub-use-margins
sub-ass-force-margins
embeddedfonts=yes                                   # use embedded fonts for SSA/ASS subs
sub-ass-style-overrides=Kerning=yes                 # allows you to override style parameters of ASS scripts
demuxer-mkv-subtitle-preroll                        # show embedded subs correctly while seeking
sub-auto=fuzzy                                      # external subs don't have to match the file name exactly to autoload
sub-file-paths=ass:srt:sub:subs:subtitles           # search for external subs in these subdirectories

# The following options only apply to subtitles without their own styling
# (i.e. not ASS but e.g. SRT). Merriweather Bold (700) ships in fonts/.
sub-fonts-dir=~~/fonts
sub-font="Merriweather"
sub-bold=yes
sub-font-size=40
sub-color="#FFFCBE11"                   # ARGB format: fill #FCBE11
sub-border-color="#FF1F1F1F"            # ARGB format: near-black outline
sub-border-size=1.5                     # thin outline
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5
sub-ass-override=force                  # force this style over styled ASS tracks
blend-subtitles                         # render subs into the video (screenshots include them)

# Starts windowed; press f to go fullscreen
#fs=yes
autofit-larger=90%x90%

################
# Video Output #
################

[high-quality]
profile-desc="High quality VO settings"
video-output-levels=full
video-sync=audio                        # no motion interpolation
opengl-swapinterval=1
scale=ewa_lanczossharp
cscale=ewa_lanczossoft
dscale=ewa_lanczossharp
scale-radius=2
scale-antiring=1
cscale-antiring=1
scaler-resizes-only
sigmoid-upscaling
correct-downscaling
temporal-dither
dither-depth=auto
gpu-context=auto
hdr-compute-peak=yes
target-colorspace-hint=yes
deband=no
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=48
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1
window-corners=round
#hwdec=auto

[default]
profile=high-quality

###################################
# Protocol Specific Configuration #
###################################

[protocol.https]
cache-secs=100                          # how many seconds of audio/video to prefetch
user-agent='Mozilla/5.0 (Macintosh; Intel Mac OS X 10.11; rv:47.0) Gecko/20100101 Firefox/47.0'

[protocol.http]
cache-secs=100                          # how many seconds of audio/video to prefetch
user-agent='Mozilla/5.0 (Macintosh; Intel Mac OS X 10.11; rv:47.0) Gecko/20100101 Firefox/47.0'

[extension.gif]
cache=no
loop-file=yes

[extension.webm]
loop-file=yes
